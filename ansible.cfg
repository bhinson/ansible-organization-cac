[defaults]
roles_path = ./roles
collections_path = ./collections:~/.ansible/collections:/usr/share/ansible/collections
interpreter_python = auto_silent
callback_result_format = yaml

[galaxy]
server_list = rh_certified, rh_validated

# The token is NOT stored here. Export it before running ansible-galaxy:
#   export ANSIBLE_GALAXY_SERVER_RH_CERTIFIED_TOKEN=<offline token>
#   export ANSIBLE_GALAXY_SERVER_RH_VALIDATED_TOKEN=<offline token>
[galaxy_server.rh_certified]
url = https://console.redhat.com/api/automation-hub/content/published/
auth_url = https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token

[galaxy_server.rh_validated]
url = https://console.redhat.com/api/automation-hub/content/validated/
auth_url = https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
